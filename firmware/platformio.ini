[platformio]
default_envs = esp32-s3-zero

; Shared base for the two ESP32-S3 Zero environments (production / debug).
; Exact pins established in Task 0 by building v27 against unpinned
; `platform = espressif32` and recording what it resolved to:
;   platform:                     espressif32 @ 7.1.3
;   framework-arduinoespressif32: @ 4.20017.260907+sha.dcc1105b
;   toolchain-xtensa-esp32s3:     @ 8.4.0+2021r2-patch5
; From the version of Arduino-ESP32 core depends the RMT driver behaviour
; (LED flicker), so these pins must not "float".
[esp32_base]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; Явное указание 4MB памяти (критично для S3 Zero)
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit NeoPixel @ 1.15.5
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.3

[env:esp32-s3-zero]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DDEBUG_LOG_ENABLED=0

[env:esp32-s3-zero-debug]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DDEBUG_LOG_ENABLED=1

; Native unit tests for lib/MirrorCore (Unity), run on the host — no
; Arduino/FreeRTOS/hardware dependency there.
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -std=gnu++17
    -DDEBUG_LOG_ENABLED=0
    -Wall
    -Wextra
